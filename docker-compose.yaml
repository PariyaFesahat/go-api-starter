services:
  postgres:
    image: hub.hamdocker.ir/postgres:16
    container_name: go-rest-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: go_rest_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: hub.hamdocker.ir/redis:7
    container_name: go-rest-api-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: